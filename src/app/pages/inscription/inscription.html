<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="brand">Sén<span class="gold">Educa</span></span>
    </div>
    <h2>Créer un compte</h2>
    <p>Rejoignez SénEduca gratuitement</p>

    <div class="erreur" *ngIf="erreur()">
      ⚠️ {{ erreur() }}
    </div>

    <div class="form-group">
      <label>Nom complet</label>
      <input type="text" [(ngModel)]="nom" placeholder="Votre nom et prénom" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="votre@email.com" />
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" [(ngModel)]="telephone" placeholder="+221 XX XXX XX XX" />
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="motDePasse" placeholder="6 caractères minimum" />
    </div>

    <div class="form-group">
      <label>Je suis</label>
      <select [(ngModel)]="role">
        <option value="parent">Parent / Élève</option>
        <option value="repetiteur">Répétiteur</option>
      </select>
    </div>

    <button class="btn-submit" (click)="sInscrire()" [disabled]="chargement()">
      {{ chargement() ? '⏳ Inscription...' : '📲 Créer mon compte' }}
    </button>

    <div class="login-links">
      <a routerLink="/login">← Déjà un compte ? Se connecter</a>
    </div>
  </div>
</div>
