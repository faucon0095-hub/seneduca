<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="brand">Sén<span class="gold">Educa</span></span>
    </div>
    <h2>Connexion</h2>
    <p>Accédez à votre espace personnel</p>

    <div class="erreur" *ngIf="erreur()">
      ⚠️ {{ erreur() }}
    </div>

    <div class="succes" *ngIf="message()">
      ✅ {{ message() }}
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="votre@email.com" />
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="motDePasse" placeholder="••••••••" />
    </div>

    <button class="btn-submit" (click)="seConnecter()" [disabled]="chargement()">
      {{ chargement() ? '⏳ Connexion...' : '🔐 Se connecter' }}
    </button>

    <div class="login-links">
      <a href="#" (click)="$event.preventDefault(); motDePasseOublie()">Mot de passe oublié ?</a>
      <a routerLink="/inscription">Créer un compte →</a>
    </div>
  </div>
</div>
